<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salt Flats Drone Defense</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cpath%20fill%3D%22%2346e0d0%22%20d%3D%22M32%204%2056%2018v28L32%2060%208%2046V18z%22%2F%3E%3C%2Fsvg%3E">
<style>
:root{--bg:#1b1d3d;--ink:#fff4dc;--hot:#ffd23f;--cool:#46e0d0;--bad:#ff3d6e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d3d}}
:root[data-theme="dark"]{--bg:#1b1d3d}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;font-weight:700}
#hp{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);width:min(440px,calc(100vw - 36px));height:24px;background:#0009;border:2px solid #fff8;border-radius:6px;overflow:hidden;box-shadow:0 2px 8px #0008}
#hpf{height:100%;width:100%;background:var(--cool);transition:width .15s}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px;border:2px solid var(--ink);border-radius:50%;opacity:.8}
#cross.aim{display:none}
#cross.enemy{border-color:var(--bad);box-shadow:0 0 8px var(--bad)}
#cross.friendly{border-color:#58a6ff;box-shadow:0 0 8px #58a6ff}
#cross.hit{border-color:var(--hot);box-shadow:0 0 8px var(--hot);transform:scale(1.5)}
#cross{transition:transform .08s,border-color .08s}
#vig{position:absolute;inset:0;background:radial-gradient(transparent 45%,var(--bad));opacity:0;transition:opacity .25s}
#hudData{display:none}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#1b1d3dd9;text-align:center;padding:24px;z-index:5}
#ov h1{margin:0;font-size:clamp(30px,7vw,56px);letter-spacing:-.02em;color:var(--hot)}
#ov p{margin:0;max-width:34em;line-height:1.5;opacity:.9}
#go{font:inherit;font-weight:700;font-size:20px;padding:14px 34px;border:0;border-radius:10px;background:var(--hot);color:#1b1d3d;cursor:pointer}
#go:focus-visible{outline:3px solid var(--cool);outline-offset:3px}
#touch{display:none}
.touch #touch{display:block}
#stick,#fire{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);border-radius:50%;border:2px solid #fff8}
#stick{left:28px;width:120px;height:120px;background:#fff1}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#fffa}
#fire{right:28px;width:92px;height:92px;background:#ff3d6e99;display:flex;align-items:center;justify-content:center;font-weight:700}
#aim,#jump{display:none;position:fixed;right:132px;width:68px;height:68px;border:2px solid #fff8;border-radius:50%;background:#0008;color:var(--ink);font:inherit;font-weight:700;touch-action:none}
#aim{bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
#jump{bottom:calc(env(safe-area-inset-bottom,0px) + 124px)}
.touch #aim,.touch #jump{display:flex;align-items:center;justify-content:center}
.touch #aim.on{background:#46e0d066;border-color:var(--cool)}
.touch #jump.on{background:#ffd23f66;border-color:var(--hot)}
#menu{display:flex;flex-direction:column;gap:10px;width:min(320px,100%);margin-top:6px;max-height:60vh;overflow-y:auto}
#menu button{font:inherit;font-weight:700;font-size:18px;padding:13px 20px;border:2px solid var(--hot);border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;text-align:left}
#menu button.main{background:var(--hot);color:#1b1d3d;text-align:center}
#menu button:disabled{opacity:.4;border-color:#fff5;cursor:not-allowed}
#menu button:focus-visible,#menu input:focus-visible{outline:3px solid var(--cool);outline-offset:2px}
#menu label{display:flex;flex-direction:column;gap:4px;text-align:left;font-size:15px}
#menu input[type=range]{width:100%;accent-color:var(--hot)}
#pb{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;border:2px solid #fff8;background:#0005;color:var(--ink);font-weight:700;z-index:3}
.touch #pb.on{display:block}
#quick{display:none;position:absolute;left:14px;top:calc(env(safe-area-inset-top,0px) + 96px);flex-direction:column;gap:6px;align-items:flex-start}
#quick.on{display:flex}
#quick button{pointer-events:auto;font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:#0007;border:1px solid #fff6;border-radius:8px;padding:6px 10px}
#toast{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);opacity:0;transition:opacity .25s;background:#0008;padding:8px 14px;border-radius:8px;font-weight:700}
#menu.map{width:min(700px,calc(100% - clamp(104px,21vw,400px)));max-height:76vh}
#menu.map svg{width:100%;height:auto;margin-bottom:4px}
#menu.map g:focus-visible{outline:none}
#menu.map g:focus-visible circle{stroke:#fff4dc}
#map-back-left,#map-back-right{display:none;position:fixed;top:0;bottom:0;width:clamp(52px,10.5vw,200px);z-index:6;align-items:center;justify-content:center;border:0;border-radius:0;padding:0;color:transparent;font-size:0;line-height:0;text-indent:-100vw;appearance:none;-webkit-appearance:none;overflow:hidden;cursor:pointer;touch-action:manipulation}
#map-back-left::before,#map-back-left::after,#map-back-right::before,#map-back-right::after{content:none}
#map-back-left{left:0;background:linear-gradient(90deg,#000c 0%,#0008 45%,transparent 100%)}
#map-back-right{right:0;background:linear-gradient(270deg,#000c 0%,#0008 45%,transparent 100%)}
#map-back-left:not([hidden]),#map-back-right:not([hidden]){display:flex}
#map-back-left:focus-visible,#map-back-right:focus-visible{outline:3px solid var(--cool);outline-offset:-4px}
#inv{display:none;position:fixed;inset:0;z-index:7;background:#1b1d3df5;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 20px)}
#inv.on{display:block}
#inv .wrap{max-width:1000px;margin:0 auto;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
#inv header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700}
#inv h2{margin:0;font-size:24px;color:var(--hot)}
#inv section{background:#ffffff14;border-radius:12px;padding:12px}
#inv .full{grid-column:1/-1}
#inv h3{margin:0 0 8px;font-size:15px;color:var(--cool)}
#inv .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
#inv .cell{font:inherit;font-size:13px;font-weight:700;min-height:46px;padding:6px 8px;border-radius:8px;border:1px solid #fff4;background:#0004;color:var(--ink);text-align:left;cursor:pointer}
#inv .cell small{display:block;font-weight:400;opacity:.7}
#inv .cell.empty{opacity:.5}
#inv .cell.sel{border-color:var(--hot);background:#ffd23f26}
#inv .cell:focus-visible{outline:3px solid var(--cool);outline-offset:2px}
#inv .st{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:2px 0}
#inv .bar{height:10px;background:#0006;border-radius:5px;overflow:hidden;margin:2px 0 6px}
#inv .bar i{display:block;height:100%;background:var(--cool)}
#inv .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#comp{display:none;position:fixed;inset:0;z-index:8;background:#1b1d3df8;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 20px)}
#comp.on{display:block}
#comp .wrap{max-width:880px;margin:0 auto}
#comp header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
#comp h2{margin:0;font-size:24px;color:var(--hot)}
#comp h3{margin:16px 0 4px;font-size:16px;color:var(--cool)}
#comp .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
#comp button{font:inherit;font-size:14px;font-weight:700;padding:8px 12px;border-radius:8px;border:1px solid #fff4;background:#0004;color:var(--ink);cursor:pointer}
#comp button.sel{border-color:var(--hot);background:#ffd23f26}
#comp button:focus-visible{outline:3px solid var(--cool);outline-offset:2px}
#comp .body{background:#ffffff14;border-radius:12px;padding:2px 16px 16px;line-height:1.55;font-size:15px}
#comp p{margin:8px 0;max-width:70ch}
#comp table{display:block;overflow-x:auto;border-collapse:collapse;font-size:14px;margin:6px 0}
#comp th,#comp td{text-align:left;padding:5px 14px 5px 0;border-bottom:1px solid #fff2;white-space:nowrap}
#warn{display:none;position:fixed;inset:0;z-index:9;background:#000a;align-items:center;justify-content:center;padding:20px}
#warn.on{display:flex}
#warn .card{background:#1b1d3d;border:2px solid var(--bad);border-radius:14px;padding:18px 20px;max-width:420px;line-height:1.5}
#warn h2{margin:0 0 6px;color:var(--bad)}
#warn p{margin:6px 0}
#warn .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
#warn button{font:inherit;font-weight:700;font-size:16px;padding:10px 16px;border-radius:10px;border:2px solid var(--hot);background:transparent;color:var(--ink);cursor:pointer}
#warn button:first-child{background:var(--hot);color:#1b1d3d}
#warn button:focus-visible{outline:3px solid var(--cool);outline-offset:2px}
#usePrompt{display:none;position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 30%);transform:translateX(-50%);pointer-events:auto;font:inherit;font-weight:700;font-size:16px;padding:10px 18px;border-radius:10px;border:2px solid var(--hot);background:#1b1d3dee;color:var(--ink);cursor:pointer}
#usePrompt.on{display:block}
#usePrompt:focus-visible{outline:3px solid var(--cool);outline-offset:3px}
</style>
</head>
<body>
<div id="hud">
  <div id="hp" role="meter" aria-label="Health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="hpf"></div></div>
  <div id="quick"><button id="qm"></button><button id="qb"></button><button id="qi"></button></div><div id="toast"></div><button id="usePrompt" type="button"></button><div id="cross"></div><div id="vig"></div>
</div>
<div id="hudData" aria-hidden="true"><span id="sc">0</span><span id="scr">0</span><span id="lv"></span><span id="wv">1</span><span id="dr">0</span></div>
<div id="touch"><div id="stick"><div id="knob"></div></div><div id="fire">FIRE</div><button id="jump" type="button" aria-label="Jump">JUMP</button><button id="aim" type="button" aria-label="Aim down sights" aria-pressed="false">AIM</button></div>
<button id="pb" aria-label="Pause">II</button>
<div id="ov"><button id="map-back-left" type="button" aria-label="Back to previous menu" hidden></button><button id="map-back-right" type="button" aria-label="Back to previous menu" hidden></button><h1 id="t"></h1><p id="m"></p><div id="menu"></div></div>
<div id="inv" role="dialog" aria-label="Inventory"></div>
<div id="comp" role="dialog" aria-label="Compendium"></div>
<div id="warn" role="alertdialog" aria-label="Backpack full"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const isTouch='ontouchstart' in window||navigator.maxTouchPoints>0;
if(isTouch)document.body.classList.add('touch');
// Persistent storage: one versioned save object behind a swappable adapter
// (localStorage here; replace `adapter` to target a server, file, or native store)
const Store=(()=>{
  const KEY='sfdd.save',VER=6,mem={};
  const adapter={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
  const defaults=()=>({v:VER,
    options:{sens:1,vol:.7,fov:75,invert:false,dev:false},
    keys:{forward:'KeyW',back:'KeyS',left:'KeyA',right:'KeyD',sprint:'ShiftLeft',jump:'Space',pause:'KeyP',inventory:'KeyI',map:'KeyM',use:'KeyE',item1:'KeyQ',item2:'KeyR',w1:'Digit1',w2:'Digit2',w3:'Digit3',compendium:'KeyC'},
    progress:{at:'landing',done:{},looted:{}},
    inventory:{cap:24,slots:[{id:'medkit',n:1}]},
    abilities:{items:['basicJump','doubleJump','glide']},
    equipment:{weapons:['blaster',null,null],itemSlots:[null,null],jumpType:'basicJump',armor:{head:null,chest:null,arms:null,waist:null,legs:null,feet:null,artifact:null},companion:null},
    wallet:{scrap:0},
    stats:{kills:0,runs:0},upgrades:{},weaponLevels:{}});
  const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
  function merge(d,src){for(const k in d){if(src&&src[k]!==undefined){if(isObj(d[k])&&Object.keys(d[k]).length)merge(d[k],src[k]);else d[k]=src[k]}}return d}
  function validateImport(saved){
    const obj=(v,name)=>{if(!isObj(v))throw new Error(name+' must be an object')};
    const arr=(v,name)=>{if(!Array.isArray(v))throw new Error(name+' must be an array')};
    obj(saved,'Save');
    if(saved.v!==undefined&&(!Number.isInteger(saved.v)||saved.v<1||saved.v>VER))throw new Error('Unsupported save version');
    for(const key of ['options','keys','progress','inventory','abilities','equipment','wallet','stats','upgrades','weaponLevels'])obj(saved[key],'Save '+key);
    obj(saved.progress.done,'Save progress.done');obj(saved.progress.looted,'Save progress.looted');
    obj(saved.inventory,'Save inventory');arr(saved.inventory.slots,'Save inventory.slots');
    saved.inventory.slots.forEach((slot,i)=>{
      obj(slot,'Inventory slot '+(i+1));
      if(typeof slot.id!=='string'||!Number.isFinite(slot.n)||slot.n<1)throw new Error('Invalid inventory slot '+(i+1));
    });
    arr(saved.abilities.items,'Save abilities.items');
    obj(saved.equipment,'Save equipment');arr(saved.equipment.weapons,'Save equipment.weapons');
    arr(saved.equipment.itemSlots,'Save equipment.itemSlots');obj(saved.equipment.armor,'Save equipment.armor');
    if(!Number.isFinite(saved.wallet.scrap)||saved.wallet.scrap<0)throw new Error('Invalid scrap amount');
    if(!Number.isFinite(saved.stats.kills)||!Number.isFinite(saved.stats.runs))throw new Error('Invalid player stats');
    for(const [key,value] of Object.entries(saved.weaponLevels))if(!Number.isFinite(value)||value<0)throw new Error('Invalid weapon level for '+key);
    return saved;
  }
  function load(){
    let d=defaults(),dirty=false;
    try{
      const raw=adapter.get(KEY);
      if(raw){
        const saved=JSON.parse(raw),from=saved.v||1;
        d=merge(d,saved);
        // v3: equipped item slots now reference backpack stacks, so return the equipped item to the backpack
        if(from<3)for(const id of d.equipment.itemSlots){if(!id)continue;const st=d.inventory.slots.find(x=>x.id===id);if(st)st.n=Math.min(999,st.n+1);else d.inventory.slots.push({id,n:1})}
        // v4/v5: movement abilities are a permanent unlock list, not backpack items
        if(from<5)d.abilities.items=[...new Set([...(d.abilities.items||[]),'basicJump','doubleJump','glide'])];
        dirty=from<VER;
      }
      else{const old=JSON.parse(adapter.get('sfdd')||'null');if(old){merge(d.options,old.OPT)}}
    }catch(e){}
    d.inventory.slots=d.inventory.slots.filter(s=>{if(s.id==='scrap'){d.wallet.scrap=Math.min(100000000,d.wallet.scrap+s.n);return false}return true});
    d.inventory.cap=Math.max(d.inventory.cap,24);d.v=VER;
    if(dirty)adapter.set(KEY,JSON.stringify(d));
    return d;
  }
  const data=load();
  return{data,defaults,save(){adapter.set(KEY,JSON.stringify(data))},
    import(raw){
      let saved;
      try{saved=validateImport(JSON.parse(raw))}catch(e){throw new Error('Could not read save: '+e.message)}
      try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){throw new Error('Could not store save in this browser: '+e.message)}
    },
    reset(){const f=defaults();for(const k in f)if(isObj(f[k])){Object.keys(data[k]).forEach(x=>delete data[k][x]);Object.assign(data[k],f[k])}this.save()}};
})();
const OPT=Store.data.options,B=Store.data.keys,INV=Store.data.inventory,ABIL=Store.data.abilities,PROG=Store.data.progress,EQ=Store.data.equipment,WAL=Store.data.wallet;

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x2b2358);
scene.fog=new THREE.Fog(0x7a3f7e,18,75);
const camera=new THREE.PerspectiveCamera(75,1,0.1,150);
camera.rotation.order='YXZ';
scene.add(camera);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

scene.add(new THREE.HemisphereLight(0xffc9a8,0x1f3a3d,0.9));
const sun=new THREE.DirectionalLight(0xfff0c8,0.7);sun.position.set(20,30,10);scene.add(sun);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(90,90),new THREE.MeshLambertMaterial({color:0x2d5a5a}));
ground.rotation.x=-Math.PI/2;scene.add(ground);
scene.add(new THREE.GridHelper(80,40,0x46e0d0,0x3c7f80));
const grid=scene.children[scene.children.length-1];grid.position.y=0.02;grid.material.opacity=.35;grid.material.transparent=true;

// Crates
const boxes=[],boxMeshes=[],crateList=[];
const crateMat=new THREE.MeshLambertMaterial({color:0xe9d8a6});
function buildCrates(n,avoid=[]){
  crateList.splice(0).forEach(m=>{scene.remove(m);boxMeshes.splice(boxMeshes.indexOf(m),1)});
  boxes.length=0;
  for(let i=0;i<n;i++){
    const w=2+Math.random()*3,d=2+Math.random()*3,h=2+Math.random()*2.5;
    let x,z;do{x=(Math.random()-.5)*74;z=(Math.random()-.5)*74}while(Math.hypot(x,z)<7||avoid.some(g=>Math.hypot(x-g.x,z-g.z)<10));
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),crateMat);
    m.position.set(x,h/2,z);scene.add(m);boxMeshes.push(m);crateList.push(m);boxes.push({x,z,hw:w/2,hd:d/2});
  }
}
buildCrates(12);
// Perimeter
const wallMat=new THREE.MeshLambertMaterial({color:0x7a3f7e});
[[0,-45,90,1],[0,45,90,1],[-45,0,1,90],[45,0,1,90]].forEach(([x,z,w,d])=>{
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,6,d),wallMat);m.position.set(x,3,z);scene.add(m);boxMeshes.push(m);
});
const LIM=43;
function resolve(p,r){
  for(const b of boxes){
    const dx=p.x-b.x,dz=p.z-b.z,px=b.hw+r-Math.abs(dx),pz=b.hd+r-Math.abs(dz);
    if(px>0&&pz>0){if(px<pz)p.x+=(dx<0?-1:1)*px;else p.z+=(dz<0?-1:1)*pz}
  }
  p.x=Math.max(-LIM,Math.min(LIM,p.x));p.z=Math.max(-LIM,Math.min(LIM,p.z));
}
const PLAYER_RADIUS=.5;
function enemyHitboxRadius(enemy){
  if(!enemy.geometry.boundingSphere)enemy.geometry.computeBoundingSphere();
  return enemy.geometry.boundingSphere.radius*Math.max(Math.abs(enemy.scale.x),Math.abs(enemy.scale.z));
}
function separatePair(first,firstRadius,second,secondRadius,fallbackAngle){
  let dx=second.x-first.x,dz=second.z-first.z;
  const distance=Math.hypot(dx,dz),minimum=firstRadius+secondRadius;
  if(distance>=minimum)return;
  if(distance<.001){dx=Math.cos(fallbackAngle);dz=Math.sin(fallbackAngle)}
  else{dx/=distance;dz/=distance}
  const push=(minimum-distance)*.5;
  first.x-=dx*push;first.z-=dz*push;second.x+=dx*push;second.z+=dz*push;
}
function separateActors(){
  for(let pass=0;pass<48;pass++){
    enemies.forEach((enemy,index)=>separatePair(P,PLAYER_RADIUS,enemy.position,enemyHitboxRadius(enemy),(index+1)*2.4));
    for(let first=0;first<enemies.length;first++)for(let second=first+1;second<enemies.length;second++){
      separatePair(enemies[first].position,enemyHitboxRadius(enemies[first]),enemies[second].position,enemyHitboxRadius(enemies[second]),(second+1)*2.4);
    }
    resolve(P,PLAYER_RADIUS);
    enemies.forEach(enemy=>resolve(enemy.position,enemyHitboxRadius(enemy)));
  }
}

// Gun
const gun=new THREE.Group();
gun.position.set(.28,-.26,-.55);camera.add(gun);
const flash=new THREE.PointLight(0xffd23f,0,8);flash.position.set(0,0,-1);camera.add(flash);

// State
const P={x:0,z:0,yaw:0,pitch:0,hp:100};
let jumpHeight=0,jumpVelocity=0,jumpPressed=false,jumpsUsed=0,glideTime=0,glideActive=false;
let state='menu',score=0,wave=0,fireCd=0,flashT=0,hurtCd=0,bob=0;
let gameTime=0,lastDamageAt=0,lastSpectreHeal=0;
const enemies=[],bits=[],projectiles=[];
const ENEMY_TYPES={
  flies:{
    name:'Flies',
    geometry:new THREE.OctahedronGeometry(.7,0),
    color:0xffd23f,
    emissive:0x664400,

  while(n>0&&INV.slots.length<INV.cap){const t=Math.min(n,maxOf(id));INV.slots.push({id,n:t});n-=t}
  return n;
}
function removeItem(id){const i=INV.slots.findIndex(s=>s.id===id);if(i<0)return;if(--INV.slots[i].n<=0)INV.slots.splice(i,1)}
function removeItems(id,n){
  for(let i=INV.slots.length-1;i>=0&&n>0;i--)if(INV.slots[i].id===id){
    const take=Math.min(n,INV.slots[i].n);INV.slots[i].n-=take;n-=take;
    if(INV.slots[i].n<=0)INV.slots.splice(i,1);
  }
  return n===0;
}
function upgradeWeapon(id){
  const stats=weaponStats(id);if(!stats)return false;
  const {copies=10,scrap=25,maxLevel=5}=stats.upgrade,level=stats.level,cost=scrap*(level+1);
  if(level>=maxLevel||count(id)<copies||WAL.scrap<cost)return false;
  removeItems(id,copies);WAL.scrap-=cost;Store.data.weaponLevels[id]=level+1;save();syncHud();return true;
}
function useItem(id){
  const it=ITEMS[id];if(!it.use||!count(id)||!it.use())return false;
  removeItem(id);beep(660,.2,'sine',.08);save();refreshQuick();return true;
}
// New gear goes straight into a matching empty slot (never when returning items from the inventory screen)
function autoEquip(id){
  const it=ITEMS[id];
  if(it.slot==='weapon'){if(EQ.weapons.includes(id))return false;const i=EQ.weapons.indexOf(null);if(i<0)return false;EQ.weapons[i]=id;return true}
  if(it.slot==='companion'){if(EQ.companion)return false;EQ.companion=id;refreshCompanion();return true}
  if(ARMOR_SLOTS.includes(it.slot)){if(EQ.armor[it.slot])return false;EQ.armor[it.slot]=id;return true}
  return false;
}
// Consumables stay in the backpack; an empty item slot is pointed at the stack
function autoSlotItem(id){
  if(ITEMS[id].slot!=='item'||EQ.itemSlots.includes(id)||!count(id))return false;
  const i=EQ.itemSlots.indexOf(null);if(i<0)return false;EQ.itemSlots[i]=id;return true;
}
function collect(k,q){
  if(k.id==='scrap'){addScrap(k.n);if(!q)toast('+'+k.n+' scrap');return true}
  let n=k.n||1;
  if(autoEquip(k.id)){k.equipped=true;n--;syncHud()}
  const overflow=n>0?addItem(k.id,n):0;
  if(autoSlotItem(k.id))refreshQuick();
  if(!overflow){if(!q)toast((k.equipped?'Equipped: ':'+ ')+ITEMS[k.id].name);return true}
  if(q){k.salvaged=overflow;addScrap(overflow*(ITEMS[k.id].scrap??DEFAULT_SCRAP_VALUE));return true}
  return false;
}
function dropLoot(pos){
  if(Math.random()>DROP.chance)return;const r=Math.random(),{scrap,items}=DROP.weights;let id,n=1;
  if(r<scrap){id='scrap';n=Math.ceil((2+Math.random()*4)*wave)}
  else if(r<scrap+items)id=pickFromPool('items');
  else id=pickFromPool('gear');
  if(!id)return;
  const c=PCOL[id]||0xb58cff;
  const m=new THREE.Mesh(new THREE.BoxGeometry(.35,.35,.35),new THREE.MeshLambertMaterial({color:c,emissive:c,emissiveIntensity:.4}));
  m.position.set(pos.x,.6,pos.z);scene.add(m);pickups.push({m,id,n,t:30});
}
function pickFromPool(pool){
  const entries=Object.keys(ITEMS).filter(id=>ITEMS[id].drop?.pool===pool&&ITEMS[id].drop.weight>0);
  const total=entries.reduce((sum,id)=>sum+ITEMS[id].drop.weight,0);
  if(!total)return null;
  let roll=Math.random()*total;
  for(const id of entries){roll-=ITEMS[id].drop.weight;if(roll<0)return id}
  return entries[entries.length-1]||null;
}
const pickGear=()=>pickFromPool('gear');
// End-of-area pickup: collect everything left on the ground; anything that does not fit is salvaged for scrap
const warnEl=$('warn');
function autoCollect(){
  let got=0,items=0,scrap=0;const equipped=[];
  for(const k of pickups.splice(0)){
    const before=WAL.scrap;collect(k,true);scene.remove(k.m);got++;if(k.equipped)equipped.push(ITEMS[k.id].name);
    if(k.salvaged){items+=k.salvaged;scrap+=WAL.scrap-before}
  }
  save();refreshQuick();return{got,salvaged:scrap,items,equipped};
}
function leavePickups(){

const ACTIONS=[['forward','Move forward'],['back','Move back'],['left','Strafe left'],['right','Strafe right'],['sprint','Sprint'],['jump','Jump'],['pause','Pause'],['inventory','Inventory'],['map','Open map'],['use','Use'],['item1','Item 1'],['item2','Item 2'],['w1','Weapon 1'],['w2','Weapon 2'],['w3','Weapon 3'],['compendium','Compendium']];
let rebind=null,mapOpen=false,mapBack=null;
function onKey(e){
  if(rebind){
    e.preventDefault();const r=rebind;rebind=null;
    if(e.code!=='Escape'){const old=B[r.a],hit=Object.keys(B).find(k=>B[k]===e.code&&k!==r.a);if(hit)B[hit]=old;B[r.a]=e.code;save()}
    controls(r.back);return;
  }
  if(compOpen()&&(e.code===B.compendium||e.code==='Escape')){e.preventDefault();closeComp();return}
  if(invOpen()&&(e.code===B.inventory||e.code==='Escape')){e.preventDefault();closeInv();return}
  if(mapOpen&&(e.code==='Escape'||e.code===B.map)){e.preventDefault();leaveMap();return}
  keys[e.code]=true;
  if(state!=='play')return;
  if(e.code===B.jump){e.preventDefault();if(!e.repeat)jumpPressed=true}
  if(e.code==='Escape'||e.code===B.pause)pause();
  else if(e.code===B.inventory)inventory(resume);
  else if(e.code===B.compendium)compendium(resume);
  else if(e.code===B.use)doUse();
  else if(/^w[123]$/.test(wk(e.code))){wSel=+wk(e.code)[1]-1;toast('Weapon '+(wSel+1)+': '+(ITEMS[EQ.weapons[wSel]]?ITEMS[EQ.weapons[wSel]].name:'empty'))}
  else if(e.code===B.map){state='paused';release();worldMap(null,null,resume)}
  else if(e.code===B.item1)useBoundItem('item1');
  else if(e.code===B.item2)useBoundItem('item2');
}
function controls(back){
  screen('Controls','Pick an action, then press the new key. Esc cancels. Mouse click fires; hold right mouse to aim down sights.');
  ACTIONS.forEach(([a,label])=>btn(label+': '+keyName(B[a]),()=>{
    rebind={a,back};screen('Press a key','Rebinding "'+label+'". Esc cancels.');
    btn('Cancel',()=>{rebind=null;controls(back)});
  }));
  btn('Reset to defaults',()=>{Object.assign(B,Store.defaults().keys);save();controls(back)});
  btn('Back',()=>options(back));
}

    const w=weaponStats(id);p.push('Level '+w.level+' / '+w.upgrade.maxLevel,`Damage ${w.dmg}`,`${(1/w.rate).toFixed(1)} shots/s`);

function worldOverview(back){

      return;
    }
    const minX=Math.min(...w.nodes.map(n=>n.x)),maxX=Math.max(...w.nodes.map(n=>n.x));
    const minY=Math.min(...w.nodes.map(n=>n.y)),maxY=Math.max(...w.nodes.map(n=>n.y));
    const px=n=>ox+8+(n.x-minX)/(maxX-minX||1)*136;
    const py=n=>oy+29+(n.y-minY)/(maxY-minY||1)*48;
    h+=`<rect x="${ox}" y="${oy}" width="154" height="102" rx="3" fill="#ffffff08" stroke="${open?'#46e0d0':'#7b858c'}" stroke-opacity=".65"/>`;
    h+=`<g data-world-map="${w.id}" tabindex="0" role="button" aria-label="Open ${w.name}" style="cursor:pointer"><rect x="${ox+1}" y="${oy+1}" width="152" height="19" fill="${open?'#46e0d022':'#7b858c22'}"/><text x="${ox+6}" y="${oy+13}" font-size="7" font-weight="700" fill="${open?'#46e0d0':'#a3adb2'}">${w.name}</text></g>`;
    w.nodes.forEach(n=>nbrs(n).forEach(m=>{if(n.id<m.id)h+=`<line x1="${px(n)}" y1="${py(n)}" x2="${px(m)}" y2="${py(m)}" stroke="${isDone(n)||isDone(m)?'#46e0d0':'#7b858c'}" stroke-opacity=".65" stroke-width="1"/>`}));
    w.nodes.forEach(n=>{
      const available=canGo(n),done=isDone(n),here=n===LV;
      const fill=done?'#ffd23f':available?'#46e0d0':'#515b63';
      const stroke=here?'#fff4dc':done?'#ffd23f':available?'#46e0d0':'#7b858c';
      h+=`<g data-map-node="${n.id}" tabindex="0" role="button" aria-label="${n.name}${done?', cleared':''}" style="cursor:pointer"><circle cx="${px(n)}" cy="${py(n)}" r="${n.final?4.3:3.5}" fill="${fill}" stroke="${stroke}" stroke-width="${here?1.5:1}"/><text x="${px(n)}" y="${py(n)+8}" text-anchor="middle" font-size="4.2" font-weight="700" fill="${available||done?'#fff4dc':'#a3adb2'}">${n.name}</text>${n.final?`<text x="${px(n)}" y="${py(n)+1.5}" text-anchor="middle" font-size="3.5" fill="#1b1d3d">&#9733;</text>`:''}</g>`;
    });
  });
  menu.innerHTML=h+'</svg>';menu.className='map';mapOpen=true;setMapBackZones(true);
  menu.querySelectorAll('[data-world-map]').forEach(el=>{
    const w=WORLDS.find(x=>x.id===el.dataset.worldMap),open=()=>worldMap(w,null,previous);
    el.onclick=open;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};
  });
  menu.querySelectorAll('[data-map-node]').forEach(el=>{
    const n=nodeById(el.dataset.mapNode),open=()=>worldMap(n.w,n,previous);
    el.onclick=open;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};
  });
}
function worldMap(w,sel,back){
  if(!w)return worldOverview(back);
  mapBack=back||pause;
  sel=sel||(w===LV.w?LV:null);const wi=WORLDS.indexOf(w);
  const details=sel?sel.name+': '+sel.desc+' '+sel.waves+' waves'+(isDone(sel)?'. Cleared, best '+PROG.done[sel.id]+'.':''):'Pick a destination on the map.';
  screen(w.menuTitle||w.name,details);
  let h='<svg viewBox="0 0 160 100" role="group" aria-label="World map">';
  w.nodes.forEach(n=>nbrs(n).forEach(m=>{if(n.id<m.id){const ok=isDone(n)||isDone(m);h+=`<line x1="${n.x}" y1="${n.y}" x2="${m.x}" y2="${m.y}" stroke="${ok?'#46e0d0':'#fff5'}" stroke-width="1.4" ${ok?'':'stroke-dasharray="3 3"'}/>`}}));
  w.nodes.forEach(n=>{
    const g=canGo(n),d=isDone(n),here=n===LV;
    h+=`<g data-n="${n.id}" ${g?'tabindex="0" role="button" style="cursor:pointer"':'opacity=".4"'} aria-label="${n.name}"><circle cx="${n.x}" cy="${n.y}" r="${n===sel?9:7}" fill="${d?'#ffd23f':g?'#1b1d3d':'#515b63'}" stroke="${here?'#fff4dc':d?'#ffd23f':g?'#46e0d0':'#7b858c'}" stroke-width="${here?2.6:1.6}"/>${n.final?`<text x="${n.x}" y="${n.y+2.6}" text-anchor="middle" font-size="7" fill="${d?'#1b1d3d':g?'#ffd23f':'#a3adb2'}">&#9733;</text>`:''}<text x="${n.x}" y="${n.y+16}" text-anchor="middle" font-size="5.5" font-weight="700" fill="${g||d?'#fff4dc':'#a3adb2'}">${n.name}</text></g>`;
  });
  menu.innerHTML=h+'</svg>';menu.className='map';mapOpen=true;setMapBackZones(true);
  menu.querySelectorAll('g[data-n]').forEach(g=>{const n=nodeById(g.dataset.n);const f=()=>worldMap(w,n,back);g.onclick=f;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}}});
  if(sel&&canGo(sel)&&!(sel===LV&&state==='paused'&&!inHome))btn('Travel to '+sel.name,()=>{mapOpen=false;mapBack=null;setMapBackZones(false);enterArea(sel,null,false)},'main');
}

function saveTransfer(back,message){
  screen('Save export / import',message||'Export your progress as a JSON file, or import a save file. Import replaces the current save.');
  btn('Export save file',()=>{
    try{
      const blob=new Blob([JSON.stringify(Store.data,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download='salt-flats-save.json';document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);saveTransfer(back,'Save exported as salt-flats-save.json.');
    }catch(e){saveTransfer(back,'Export failed: '+e.message)}
  },'main');
  btn('Import save file',()=>{
    const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.hidden=true;menu.appendChild(input);
    input.onchange=async()=>{
      const file=input.files?.[0];input.remove();if(!file)return;
      try{
        if(file.size>1048576)throw new Error('Save file is too large (maximum 1 MB).');
        const raw=await file.text();
        if(!confirm('Import this save and replace your current progress?'))return;
        Store.import(raw);location.reload();
      }catch(e){saveTransfer(back,'Import failed: '+e.message)}
    };
    input.click();
  });
  btn('Back',()=>options(back));
}

const COMP=[
['basics','Basics',()=>`<h3>Goal</h3><p>Drones have overrun the flats. Home is your safe base. Travel out on the map, clear each area of its drone waves, and push on to a world's final area (marked with a star) to open the next world.</p>

['combat','Combat',()=>`<h3>Drones</h3><p>A drone has 2 health. It flies straight at you and hurts you on contact (within 1.6 units) for 12 damage, at most once every 0.7 seconds. Armor reduces that damage.</p>
<h3>Waves</h3><p>Wave N brings 3 + 2N drones. Drone speed starts at 2.4, rises 0.3 per wave, varies a little at random, and is then multiplied by the area's drone speed in the Worlds table.</p>

compEl.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.x)return closeComp();if(b.dataset.t){compTab=b.dataset.t;renderComp();compEl.scrollTop=0}};
function compendium(back){if(state==='play'){state='paused';release()}compBack=back;compEl.classList.add('on');renderComp()}
function closeComp(){compEl.classList.remove('on');const b=compBack;compBack=null;if(b)b()}
function exitGame(){state='menu';release();screen('Game closed','Thanks for playing. Your progress is saved.');btn('Reopen',goHome,'main');try{window.close()}catch(e){}}
// Home: a neutral, weapon-free hub. Pads open the map and the upgrade bench.
const homeGroup=new THREE.Group();homeGroup.visible=false;scene.add(homeGroup);
const HOME_BOXES=[{x:-9,z:-9.5,hw:1.5,hd:.8},{x:9,z:-9.5,hw:1.7,hd:.7},{x:0,z:-9.5,hw:1.2,hd:.8}];
const HOME_PADS=[{x:-9,z:-6,label:'Open map',menu:true,act:()=>worldMap(null,null,resume)},{x:9,z:-6,label:'Upgrade bench',menu:true,act:()=>upgrades(resume)},{x:0,z:-6,label:'Open compendium',menu:true,act:()=>compendium(resume)},{x:13,z:4,label:'Open dev menu',menu:true,on:()=>OPT.dev,act:()=>devMenu(resume)}];
const UPGRADES=[]; // later: {id,name,desc,cost}; ownership is saved in Store.data.upgrades
const devPed=new THREE.Group();devPed.visible=false;homeGroup.add(devPed);
(function(){

  plaza.rotation.x=-Math.PI/2;plaza.position.y=.03;homeGroup.add(plaza);

  });
  const mat=c=>new THREE.MeshBasicMaterial({color:c,fog:false});
  const base=new THREE.Mesh(new THREE.CylinderGeometry(.8,1,1.1,16),new THREE.MeshLambertMaterial({color:0x3a3350}));base.position.set(13,.55,4);
  const orb=new THREE.Mesh(new THREE.OctahedronGeometry(.45),mat(0xff3d6e));orb.position.set(13,1.9,4);

function enterHome(){
  inHome=true;areaClear=true;padHot=null;removeCache();homeGroup.visible=true;gun.visible=false;
  gates.splice(0).forEach(g=>scene.remove(g.m));buildCrates(0);boxes.push(...HOME_BOXES);syncDev();
  scene.background.setHex(0x2e3a4a);scene.fog.color.setHex(0x9a8a7a);
  enemies.splice(0).forEach(m=>scene.remove(m));leavePickups();boostT=0;lastDamageAt=gameTime;lastSpectreHeal=gameTime;
  setHp(maxHp());jumpHeight=jumpVelocity=0;jumpsUsed=glideTime=0;glideActive=false;P.x=0;P.z=10;P.yaw=P.pitch=0;camera.position.set(0,1.7,10);camera.rotation.set(0,0,0);

function upgrades(back){

  UPGRADES.forEach(u=>{const own=Store.data.upgrades[u.id];

// Use key: interact with the nearest station at Home, or the supply cache in a cleared area
let cache=null;
function removeCache(){if(cache){scene.remove(cache.m);cache=null}}
function spawnCache(){
  removeCache();if(inHome||!areaClear||PROG.looted[LV.id])return;
  let x=0,z=0;
  for(let i=0;i<40;i++){x=(Math.random()-.5)*50;z=(Math.random()-.5)*50;if(Math.hypot(x,z)>6&&!boxes.some(b=>Math.abs(x-b.x)<b.hw+2.5&&Math.abs(z-b.z)<b.hd+2.5))break}
  const m=new THREE.Group(),c=0xffd23f,body=new THREE.Mesh(new THREE.BoxGeometry(1.6,1,1.1),new THREE.MeshLambertMaterial({color:c,emissive:c,emissiveIntensity:.35}));
  body.position.y=.5;const l=label('Supply cache');l.position.y=2.6;m.add(body,l);m.position.set(x,0,z);scene.add(m);
  cache={m,x,z,label:'Open supply cache',act:openCache};
}
function openCache(){
  const rolls=[{id:'scrap',n:Math.ceil((15+Math.random()*25)*LV.waves)},Math.random()<.35&&GEAR.length?{id:pickGear(),n:1}:{id:'medkit',n:2}];
  rolls.forEach(k=>collect(k,true));
  PROG.looted[LV.id]=true;removeCache();save();syncHud();beep(880,.3,'sine',.1);
  const extra=rolls.reduce((t,k)=>t+(k.salvaged||0),0);
  toast('Cache opened: '+rolls.map(k=>k.id==='scrap'?k.n+' scrap':(k.n>1?k.n+' ':'')+ITEMS[k.id].name+(k.equipped?' (equipped)':'')).join(', ')+(extra?' (backpack full, '+extra+' salvaged)':''),3500);
}
function nearestUse(){
  let best=null,bd=3;
  for(const u of inHome?HOME_PADS:cache?[cache]:[]){if(u.on&&!u.on())continue;const d=Math.hypot(P.x-u.x,P.z-u.z);if(d<bd){bd=d;best=u}}
  return best;
}
function doUse(){
  const u=nearestUse();if(!u){toast('Nothing nearby to use');return}
  if(u.menu){state='paused';release()}
  u.act();
}
function updatePrompt(){
  const u=state==='play'?nearestUse():null,e=$('usePrompt');
  e.classList.toggle('on',!!u);
  if(u){const t='['+keyName(B.use)+'] '+u.label;if(e.textContent!==t)e.textContent=t}
}
$('usePrompt').onclick=doUse;
// Developer options: switched on in Options. Adds the Home pedestal and a dev menu (also in the pause menu).
let god=false;const DEV_BOX={x:13,z:4,hw:.8,hd:.8};
function syncDev(){
  devPed.visible=!!OPT.dev;if(!OPT.dev)god=false;
  const i=boxes.indexOf(DEV_BOX);
  if(OPT.dev&&inHome){if(i<0)boxes.push(DEV_BOX)}else if(i>=0)boxes.splice(i,1);
}
function devMenu(back,note){
  screen('Developer menu',note||'Testing tools. Scrap, items and progress changes are saved.');
  btn('God mode: '+(god?'On':'Off'),()=>{god=!god;devMenu(back,'God mode '+(god?'on':'off')+'.')});
  btn('Heal to full',()=>{setHp(maxHp());devMenu(back,'Healed to full.')});
  btn('Add 10,000 scrap',()=>{addScrap(10000);save();devMenu(back,'Scrap: '+WAL.scrap.toLocaleString())});
  btn('Max out scrap',()=>{addScrap(SCRAP_CAP);save();devMenu(back,'Scrap: '+WAL.scrap.toLocaleString())});
  btn('Give item...',()=>devItems(back));
  btn('Travel to any area...',()=>devTravel(back));
  btn('Unlock all areas',()=>{NODES.forEach(n=>{if(!isDone(n))PROG.done[n.id]=0});save();devMenu(back,'All areas and worlds unlocked.')});
  btn('Reset supply caches',()=>{Object.keys(PROG.looted).forEach(k=>delete PROG.looted[k]);save();devMenu(back,'Supply caches reset.')});
  btn('Remove all drones',()=>{enemies.splice(0).forEach(m=>scene.remove(m));devMenu(back,'Drones removed. Resume to finish the area.')});
  btn('Close',back,'main');
}
function devItems(back){
  screen('Give item','Stackables give 10, equipment gives 1.');
  Object.keys(ITEMS).forEach(id=>btn(ITEMS[id].name+' ['+(ITEMS[id].slot==='item'?'item':ITEMS[id].slot)+']',()=>{
    const k={id,n:ITEMS[id].slot==='item'?10:1};collect(k,true);save();refreshQuick();devItems(back);$('m').textContent='Gave '+ITEMS[id].name+(k.equipped?' (equipped).':k.salvaged?' (backpack full, salvaged).':'.');
  }));
  btn('Back',()=>devMenu(back),'main');
}
function devTravel(back){
  screen('Travel to any area','Ignores locks. Undefeated areas start a fight.');
  NODES.forEach(n=>btn(n.w.name+': '+n.name,()=>enterArea(n,null,false)));
  btn('Back',()=>devMenu(back),'main');
}
function gatePos(a,b){const dx=b.x-a.x,dy=b.y-a.y,l=Math.max(Math.abs(dx),Math.abs(dy))||1;return{x:dx/l*39,z:dy/l*39}}
function label(t,color='#fff4dc'){
  const c=document.createElement('canvas');c.width=512;c.height=96;const x=c.getContext('2d');
  x.font='bold 54px sans-serif';x.textAlign='center';x.lineWidth=8;x.strokeStyle='#1b1d3d';x.fillStyle=color;x.strokeText(t,256,64);x.fillText(t,256,64);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),fog:false,transparent:true}));sp.scale.set(8,1.5,1);sp.position.y=5.6;return sp;
}
function spawnGates(){
  gates.splice(0).forEach(g=>scene.remove(g.m));
  const active=areaClear;
  nbrs(LV).forEach(n=>{
    const p=gatePos(LV,n),m=new THREE.Group();
    const outer=new THREE.Shape(),inner=new THREE.Path();
    for(let i=0;i<6;i++){const a=i*Math.PI/3,x=Math.cos(a)*2.5,y=Math.sin(a)*2.5;if(i===0)outer.moveTo(x,y);else outer.lineTo(x,y)}
    outer.closePath();
    for(let i=5;i>=0;i--){const a=i*Math.PI/3,x=Math.cos(a)*2.15,y=Math.sin(a)*2.15;if(i===5)inner.moveTo(x,y);else inner.lineTo(x,y)}
    inner.closePath();outer.holes.push(inner);
    const color=active?(isDone(n)?0xffd23f:0x46e0d0):0x7b858c;
    const labelColor=active?(isDone(n)?'#ffd23f':'#46e0d0'):'#7b858c';
    const ring=new THREE.Mesh(new THREE.ShapeGeometry(outer),new THREE.MeshBasicMaterial({color,fog:false,side:THREE.DoubleSide}));
    ring.position.y=2.6;m.add(ring,label(n.name+(isDone(n)?'':' (new)'),labelColor));
    m.position.set(p.x,0,p.z);m.rotation.y=Math.atan2(-p.x,-p.z);scene.add(m);gates.push({x:p.x,z:p.z,node:n,m,active});
  });
}
function enterArea(n,from,force){
  LV=n;PROG.at=n.id;inHome=false;homeGroup.visible=false;gun.visible=true;gates.splice(0).forEach(g=>scene.remove(g.m));
  areaClear=isDone(n)&&!force;
  buildCrates(n.crates,nbrs(n).map(m=>gatePos(n,m)));
  scene.background.setHex(n.sky);scene.fog.color.setHex(n.fog);
  enemies.splice(0).forEach(m=>scene.remove(m));leavePickups();boostT=0;lastDamageAt=gameTime;lastSpectreHeal=gameTime;
  Store.data.stats.runs++;jumpHeight=jumpVelocity=0;jumpsUsed=glideTime=0;glideActive=false;P.x=P.z=0;P.yaw=P.pitch=0;
  if(from){const g=gatePos(n,from);P.x=g.x*.8;P.z=g.z*.8;P.yaw=Math.atan2(g.x,g.z)}
  else{setHp(maxHp());score=0;$('sc').textContent=0}
  wave=0;$('lv').textContent=n.name;save();
  spawnGates();spawnCache();
  if(areaClear)$('wv').textContent='Clear';else spawnWave();
  resume();
}
function resume(){state='play';ov.style.display='none';$('pb').classList.add('on');$('quick').classList.add('on');refreshQuick();if(!isTouch)renderer.domElement.requestPointerLock()}
function pause(){
  state='paused';release();
  screen(inHome?'Salt Flats Drone Defense':'Paused',inHome?'Home. You are safe here.':LV.name+', '+LV.w.name+'. Score '+score+'.');
  btn('Resume',resume,'main');btn('Map',()=>worldMap(null,null,pause));btn('Inventory',()=>inventory(pause));
  btn('Compendium',()=>compendium(pause));btn('Options',()=>options(pause));
  if(OPT.dev)btn('Dev menu',()=>devMenu(pause));
  if(!inHome){btn('Restart area',()=>enterArea(LV,null,true));btn('Return home',goHome)}
  btn('Exit game',exitGame);
}
function complete(){
  areaClear=true;const first=!isDone(LV);
  PROG.done[LV.id]=Math.max(PROG.done[LV.id]||0,score);save();$('wv').textContent='Clear';spawnGates();spawnCache();beep(880,.3,'sine',.1);
  const nw=LV.final&&WORLDS[WORLDS.indexOf(LV.w)+1];
  const r=autoCollect(),finish=()=>{
    if(nw&&first){state='won';release();screen(LV.w.name+' cleared','Score '+score+'. '+nw.name+' is now on the map.');
      btn('Open map',()=>worldMap(nw,null,resume),'main');btn('Keep exploring',resume);return}
    if(state!=='play')resume();
    const rewards=[];
    if(r.got)rewards.push(r.got+' pickup'+(r.got>1?'s':'')+' collected');
    if(r.salvaged)rewards.push(r.salvaged+' scrap salvaged');
    if(r.equipped.length)rewards.push('equipped '+r.equipped.join(', '));
    toast(rewards.length?'Area clear. '+rewards.join('; ')+'.':'Area clear. Follow a gate to travel on.');
  };
  if(r.items)notifyFull(r,finish);else finish();
}
function over(){
  state='over';release();const r=autoCollect();
  screen('Overrun at '+LV.name,'Score '+score+'. '+(r.got?'Everything that dropped was collected'+(r.items?'; '+r.items+' item'+(r.items>1?'s':'')+' did not fit and '+(r.items>1?'were':'was')+' salvaged for '+r.salvaged+' scrap':'')+'.':'The flats go quiet.'));
  btn('Retry area',()=>enterArea(LV,null,true),'main');btn('Open map',()=>worldMap(null,null,over));btn('Return home',goHome);
}
$('pb').addEventListener('click',()=>{if(state==='play')pause()});

// Loop
const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05);
  if(state==='play'){
    // movement
    let f=(keys[B.forward]||keys.ArrowUp?1:0)-(keys[B.back]||keys.ArrowDown?1:0)-mv.y;
    let s=(keys[B.right]||keys.ArrowRight?1:0)-(keys[B.left]||keys.ArrowLeft?1:0)+mv.x;
    const l=Math.hypot(f,s);if(l>1){f/=l;s/=l}
    const sp=(keys[B.sprint]?9:6)*(1+bonus('speed'))*dt,sy=Math.sin(P.yaw),cy=Math.cos(P.yaw);
    P.x+=(-sy*f+cy*s)*sp;P.z+=(-cy*f-sy*s)*sp;resolve(P,PLAYER_RADIUS);
    if(l>0)bob+=dt*10;
    const jumpItem=ABILITIES[EQ.jumpType];
    if(jumpPressed){
      const maxJumps=jumpItem?.jumps||1;
      if(!jumpItem)toast('No jump type equipped');
      else if(jumpHeight===0){jumpsUsed=1;glideTime=0;glideActive=false;jumpVelocity=jumpItem.jumpVelocity}
      else if(jumpItem.glideDecay&&!glideActive){glideActive=true;glideTime=0}
      else if(!jumpItem.glideDecay&&jumpsUsed<maxJumps){jumpsUsed++;jumpVelocity=jumpItem.jumpVelocity}
      jumpPressed=false;
    }
    if(jumpHeight>0||jumpVelocity>0){
      if(glideActive&&jumpHeight>0&&jumpVelocity<=0){
        glideTime+=dt;
        const fallSpeed=Math.max(jumpItem.minGlideFallSpeed,jumpItem.maxGlideFallSpeed/(1+Math.log1p(glideTime*jumpItem.glideDecay)));
        jumpVelocity=-fallSpeed;
      }else{
        jumpVelocity-=23*dt;
      }
      jumpHeight=Math.max(0,jumpHeight+jumpVelocity*dt);
      if(jumpHeight===0){jumpVelocity=0;jumpsUsed=0;glideTime=0;glideActive=false}
    }
    camera.position.set(P.x,1.7+jumpHeight+Math.sin(bob)*.04*(l>0),P.z);
    camera.rotation.set(P.pitch,P.yaw,0);
    // weapon
    fireCd-=dt;boostT=Math.max(0,boostT-dt);if(firing&&fireCd<=0&&!inHome)shoot();
    if(flashT>0){flashT-=dt;if(flashT<=0)flash.intensity=0}
    // enemies
    companionTick(dt);hurtCd-=dt;
    for(const e of enemies){
      const dx=P.x-e.position.x,dz=P.z-e.position.z,d=Math.hypot(dx,dz)||1;
      const type=ENEMY_TYPES[e.userData.type]||ENEMY_TYPES.flies;
      const dirX=dx/d,dirZ=dz/d;
      e.userData.cooldown=Math.max(0,e.userData.cooldown-dt);
      e.userData.ph+=dt*3;e.position.y=1.3+Math.sin(e.userData.ph)*.25;e.rotation.y+=dt*2;
      if(e.userData.hf>0){e.userData.hf-=dt;if(e.userData.hf<=0)e.material.emissive.setHex(type.emissive)}

      if(e.userData.type==='marshalls'){
        if(d<type.keepDistance){
          e.position.x-=dirX*e.userData.speed*dt;
          e.position.z-=dirZ*e.userData.speed*dt;
        }
        if(d<=type.shootRange && e.userData.cooldown<=0){
          e.userData.cooldown=type.projectileCooldown;
          const damage=type.projectileDamage || type.damage*4;
          const projectileSpeed = type.projectileSpeed || 8;
          const pOrigin=e.position.clone().add(new THREE.Vector3(0,0.2,0));
          const pTarget=new THREE.Vector3(P.x,1.7+jumpHeight,P.z);
          const dir=new THREE.Vector3().subVectors(pTarget,pOrigin).normalize();
          const velocity=dir.multiplyScalar(projectileSpeed);
          spawnProjectile({origin:pOrigin,velocity,damage,color:type.color,mass:.18,radius:.18,owner:'enemy',life:4});
          beep(430,.12,'square',.04);
        }
      }else{
        if(d>type.contactRange){e.position.x+=dirX*e.userData.speed*dt;e.position.z+=dirZ*e.userData.speed*dt}
      }

      if(e.userData.knockback.lengthSq()>.0025){
        e.position.addScaledVector(e.userData.knockback,dt);
        e.userData.knockback.multiplyScalar(Math.max(0,1-dt*8));
      }else e.userData.knockback.set(0,0,0);
      resolve(e.position,enemyHitboxRadius(e));
      if(d<e.userData.contactRange&&jumpHeight<1.1&&hurtCd<=0){
        hurtCd=.7;hurtPlayer(e.userData.damage);
      }
    }
    separateActors();
    for(let i=projectiles.length-1;i>=0;i--){
      const p=projectiles[i];
      const travel=p.velocity.length()*dt;
      let hit=null;
      if(p.owner==='player'&&travel>0){
        raycaster.set(p.mesh.position,p.velocity.clone().normalize());raycaster.far=travel+p.radius;
        hit=raycaster.intersectObjects(enemies.concat(boxMeshes),false)[0]||null;
      }
      p.mesh.position.addScaledVector(p.velocity,dt);
      p.life-=dt;
      if(hit){
        if(hit.object.userData.hp!==undefined){
          const impulse=p.velocity.clone().normalize().multiplyScalar(Math.min(5,p.mass*p.velocity.length()*.45));
          hurt(hit.object,p.damage,impulse);
        }
        scene.remove(p.mesh);projectiles.splice(i,1);continue;
      }
      if(p.owner==='enemy'&&Math.hypot(p.mesh.position.x-P.x,p.mesh.position.y-(1.7+jumpHeight),p.mesh.position.z-P.z)<.9){
        scene.remove(p.mesh);projectiles.splice(i,1);hurtPlayer(p.damage);
        if(state!=='play')break;
        continue;
      }
      if(p.life<=0){scene.remove(p.mesh);projectiles.splice(i,1)}
    }
    for(let i=pickups.length-1;i>=0;i--){
      const k=pickups[i];k.t-=dt;k.m.rotation.y+=dt*2;k.m.position.y=.6+Math.sin(k.t*3)*.12;
      if(Math.hypot(P.x-k.m.position.x,P.z-k.m.position.z)<1.5){
        if(collect(k)){scene.remove(k.m);pickups.splice(i,1);beep(880,.1,'sine',.06);save();refreshQuick();continue}
        else if(!k.warned){k.warned=1;toast('Inventory full')}
      }
    }
    for(const g of gates)if(g.active&&Math.hypot(P.x-g.x,P.z-g.z)<2.8){enterArea(g.node,LV);break}
    $('dr').textContent=enemies.length;
    if(state==='play'&&!areaClear&&!enemies.length){if(wave>=LV.waves)complete();else spawnWave()}
  }
  gameTime += dt;
  updatePrompt();
  for(let i=bits.length-1;i>=0;i--){
    const b=bits[i];b.t-=dt;b.v.y-=14*dt;b.m.position.addScaledVector(b.v,dt);
    if(b.t<=0){scene.remove(b.m);bits.splice(i,1)}
  }
  updateAim(dt);
  syncGunModel();
  updateReticle();
  renderer.render(scene,camera);
}
camera.position.set(0,1.7,0);
tick();
// Always start at home, in play, with no menu in the way
enterHome();state='play';ov.style.display='none';
$('pb').classList.add('on');$('quick').classList.add('on');refreshQuick();
document.addEventListener('pointerdown',unlockAudio);
addEventListener('pagehide',()=>{autoCollect()});
toast(isTouch?'Stick to move, drag to look, JUMP leaps or activates Glide in midair. AIM zooms.':'Click to look around. Space jumps or activates Glide in midair; hold right mouse to aim. Esc opens the menu.',5000);
})();
</script>
