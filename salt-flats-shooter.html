<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salt Flats Drone Defense</title>
<style>
:root{--bg:#1b1d3d;--ink:#fff4dc;--hot:#ffd23f;--cool:#46e0d0;--bad:#ff3d6e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d3d}}
:root[data-theme="dark"]{--bg:#1b1d3d}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;font-weight:700}
#stats{position:absolute;left:14px;top:calc(env(safe-area-inset-top,0px) + 12px);font-size:18px;line-height:1.5;text-shadow:0 2px 0 #0006}
#hp{width:160px;height:10px;background:#0006;border-radius:5px;overflow:hidden}
#hpf{height:100%;width:100%;background:var(--cool);transition:width .15s}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px;border:2px solid var(--ink);border-radius:50%;opacity:.8}
#cross.hit{border-color:var(--hot);transform:scale(1.5)}
#cross{transition:transform .08s,border-color .08s}
#vig{position:absolute;inset:0;background:radial-gradient(transparent 45%,var(--bad));opacity:0;transition:opacity .25s}
#wave{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;font-size:18px;text-align:right;text-shadow:0 2px 0 #0006}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#1b1d3dd9;text-align:center;padding:24px;z-index:5}
#ov h1{margin:0;font-size:clamp(30px,7vw,56px);letter-spacing:-.02em;color:var(--hot)}
#ov p{margin:0;max-width:34em;line-height:1.5;opacity:.9}
#go{font:inherit;font-weight:700;font-size:20px;padding:14px 34px;border:0;border-radius:10px;background:var(--hot);color:#1b1d3d;cursor:pointer}
#go:focus-visible{outline:3px solid var(--cool);outline-offset:3px}
#touch{display:none}
.touch #touch{display:block}
#stick,#fire{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);border-radius:50%;border:2px solid #fff8}
#stick{left:28px;width:120px;height:120px;background:#fff1}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#fffa}
#fire{right:28px;width:92px;height:92px;background:#ff3d6e99;display:flex;align-items:center;justify-content:center;font-weight:700}
#menu{display:flex;flex-direction:column;gap:10px;width:min(320px,100%);margin-top:6px;max-height:60vh;overflow-y:auto}
#menu button{font:inherit;font-weight:700;font-size:18px;padding:13px 20px;border:2px solid var(--hot);border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;text-align:left}
#menu button.main{background:var(--hot);color:#1b1d3d;text-align:center}
#menu button:disabled{opacity:.4;border-color:#fff5;cursor:not-allowed}
#menu button:focus-visible,#menu input:focus-visible{outline:3px solid var(--cool);outline-offset:2px}
#menu label{display:flex;flex-direction:column;gap:4px;text-align:left;font-size:15px}
#menu input[type=range]{width:100%;accent-color:var(--hot)}
#pb{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;border:2px solid #fff8;background:#0005;color:var(--ink);font-weight:700;z-index:3}
.touch #pb.on{display:block}
#quick{display:none;position:absolute;left:14px;top:calc(env(safe-area-inset-top,0px) + 96px);flex-direction:column;gap:6px;align-items:flex-start}
#quick.on{display:flex}
#quick button{pointer-events:auto;font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:#0007;border:1px solid #fff6;border-radius:8px;padding:6px 10px}
#toast{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);opacity:0;transition:opacity .25s;background:#0008;padding:8px 14px;border-radius:8px;font-weight:700}
#menu.map{width:min(560px,100%);max-height:none}
#menu.map svg{width:100%;height:auto;margin-bottom:4px}
#menu.map g:focus-visible{outline:none}
#menu.map g:focus-visible circle{stroke:#fff4dc}
#inv{display:none;position:fixed;inset:0;z-index:7;background:#1b1d3df5;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 20px)}
#inv.on{display:block}
#inv .wrap{max-width:1000px;margin:0 auto;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
#inv header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700}
#inv h2{margin:0;font-size:24px;color:var(--hot)}
#inv section{background:#ffffff14;border-radius:12px;padding:12px}
#inv .full{grid-column:1/-1}
#inv h3{margin:0 0 8px;font-size:15px;color:var(--cool)}
#inv .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
#inv .cell{font:inherit;font-size:13px;font-weight:700;min-height:46px;padding:6px 8px;border-radius:8px;border:1px solid #fff4;background:#0004;color:var(--ink);text-align:left;cursor:pointer}
#inv .cell small{display:block;font-weight:400;opacity:.7}
#inv .cell.empty{opacity:.5}
#inv .cell.sel{border-color:var(--hot);background:#ffd23f26}
#inv .cell:focus-visible{outline:3px solid var(--cool);outline-offset:2px}
#inv .st{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:2px 0}
#inv .bar{height:10px;background:#0006;border-radius:5px;overflow:hidden;margin:2px 0 6px}
#inv .bar i{display:block;height:100%;background:var(--cool)}
#inv .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#comp{display:none;position:fixed;inset:0;z-index:8;background:#1b1d3df8;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 20px)}
#comp.on{display:block}
#comp .wrap{max-width:880px;margin:0 auto}
#comp header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
#comp h2{margin:0;font-size:24px;color:var(--hot)}
#comp h3{margin:16px 0 4px;font-size:16px;color:var(--cool)}
#comp .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
#comp button{font:inherit;font-size:14px;font-weight:700;padding:8px 12px;border-radius:8px;border:1px solid #fff4;background:#0004;color:var(--ink);cursor:pointer}
#comp button.sel{border-color:var(--hot);background:#ffd23f26}
#comp button:focus-visible{outline:3px solid var(--cool);outline-offset:2px}
#comp .body{background:#ffffff14;border-radius:12px;padding:2px 16px 16px;line-height:1.55;font-size:15px}
#comp p{margin:8px 0;max-width:70ch}
#comp table{display:block;overflow-x:auto;border-collapse:collapse;font-size:14px;margin:6px 0}
#comp th,#comp td{text-align:left;padding:5px 14px 5px 0;border-bottom:1px solid #fff2;white-space:nowrap}
#warn{display:none;position:fixed;inset:0;z-index:9;background:#000a;align-items:center;justify-content:center;padding:20px}
#warn.on{display:flex}
#warn .card{background:#1b1d3d;border:2px solid var(--bad);border-radius:14px;padding:18px 20px;max-width:420px;line-height:1.5}
#warn h2{margin:0 0 6px;color:var(--bad)}
#warn p{margin:6px 0}
#warn .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
#warn button{font:inherit;font-weight:700;font-size:16px;padding:10px 16px;border-radius:10px;border:2px solid var(--hot);background:transparent;color:var(--ink);cursor:pointer}
#warn button:first-child{background:var(--hot);color:#1b1d3d}
#warn button:focus-visible{outline:3px solid var(--cool);outline-offset:2px}
</style>
</head>
<body>
<div id="hud">
  <div id="stats"><div>Score <span id="sc">0</span></div><div>Scrap <span id="scr">0</span></div><div id="hp"><div id="hpf"></div></div></div>
  <div id="wave"><span id="lv"></span><br>Wave <span id="wv">1</span><br>Drones <span id="dr">0</span></div>
  <div id="quick"><button id="qm"></button><button id="qb"></button><button id="qi"></button></div><div id="toast"></div><div id="cross"></div><div id="vig"></div>
</div>
<div id="touch"><div id="stick"><div id="knob"></div></div><div id="fire">FIRE</div></div>
<button id="pb" aria-label="Pause">II</button>
<div id="ov"><h1 id="t"></h1><p id="m"></p><div id="menu"></div></div>
<div id="inv" role="dialog" aria-label="Inventory"></div>
<div id="comp" role="dialog" aria-label="Compendium"></div>
<div id="warn" role="alertdialog" aria-label="Backpack full"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const isTouch='ontouchstart' in window||navigator.maxTouchPoints>0;
if(isTouch)document.body.classList.add('touch');
// Persistent storage: one versioned save object behind a swappable adapter
// (localStorage here; replace `adapter` to target a server, file, or native store)
const Store=(()=>{
  const KEY='sfdd.save',VER=3,mem={};
  const adapter={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
  const defaults=()=>({v:VER,
    options:{sens:1,vol:.7,fov:75,invert:false},
    keys:{forward:'KeyW',back:'KeyS',left:'KeyA',right:'KeyD',sprint:'ShiftLeft',pause:'KeyP',inventory:'KeyI',map:'KeyM',use:'KeyE',item1:'KeyQ',item2:'KeyR',w1:'Digit1',w2:'Digit2',w3:'Digit3',compendium:'KeyC'},
    progress:{at:'landing',done:{}},
    inventory:{cap:24,slots:[{id:'medkit',n:1}]},
    equipment:{weapons:['blaster',null,null],itemSlots:[null,null],armor:{head:null,chest:null,arms:null,waist:null,legs:null,feet:null,artifact:null},companion:null},
    wallet:{scrap:0},
    stats:{kills:0,runs:0},upgrades:{}});
  const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
  function merge(d,src){for(const k in d){if(src&&src[k]!==undefined){if(isObj(d[k])&&Object.keys(d[k]).length)merge(d[k],src[k]);else d[k]=src[k]}}return d}
  function load(){
    let d=defaults();
    try{
      const raw=adapter.get(KEY);
      if(raw){
        const saved=JSON.parse(raw),oldVersion=saved.v||1;
        d=merge(d,saved);
        if(oldVersion<3){
          for(const id of d.equipment.itemSlots){
            if(!id)continue;
            const stack=d.inventory.slots.find(s=>s.id===id);
            if(stack)stack.n=Math.min(999,stack.n+1);
            else d.inventory.slots.push({id,n:1});
          }
          d.migratedItemSlots=true;
        }
      }
      else{const old=JSON.parse(adapter.get('sfdd')||'null');if(old){merge(d.options,old.OPT)}}
    }catch(e){}
    d.inventory.slots=d.inventory.slots.filter(s=>{if(s.id==='scrap'){d.wallet.scrap=Math.min(100000000,d.wallet.scrap+s.n);return false}return true});
    d.inventory.cap=Math.max(d.inventory.cap,24);d.v=VER;
    if(d.migratedItemSlots){delete d.migratedItemSlots;adapter.set(KEY,JSON.stringify(d))}
    return d;
  }
  const data=load();
  return{data,defaults,save(){adapter.set(KEY,JSON.stringify(data))},
    reset(){const f=defaults();for(const k in f)if(isObj(f[k])){Object.keys(data[k]).forEach(x=>delete data[k][x]);Object.assign(data[k],f[k])}this.save()}};
})();
const OPT=Store.data.options,B=Store.data.keys,INV=Store.data.inventory,PROG=Store.data.progress,EQ=Store.data.equipment,WAL=Store.data.wallet;

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x2b2358);
scene.fog=new THREE.Fog(0x7a3f7e,18,75);
const camera=new THREE.PerspectiveCamera(75,1,0.1,150);
camera.rotation.order='YXZ';
scene.add(camera);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

scene.add(new THREE.HemisphereLight(0xffc9a8,0x1f3a3d,0.9));
const sun=new THREE.DirectionalLight(0xfff0c8,0.7);sun.position.set(20,30,10);scene.add(sun);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(90,90),new THREE.MeshLambertMaterial({color:0x2d5a5a}));
ground.rotation.x=-Math.PI/2;scene.add(ground);
scene.add(new THREE.GridHelper(80,40,0x46e0d0,0x3c7f80));
const grid=scene.children[scene.children.length-1];grid.position.y=0.02;grid.material.opacity=.35;grid.material.transparent=true;

// Crates
const boxes=[],boxMeshes=[],crateList=[];
const crateMat=new THREE.MeshLambertMaterial({color:0xe9d8a6});
function buildCrates(n,avoid=[]){
  crateList.splice(0).forEach(m=>{scene.remove(m);boxMeshes.splice(boxMeshes.indexOf(m),1)});
  boxes.length=0;
  for(let i=0;i<n;i++){
    const w=2+Math.random()*3,d=2+Math.random()*3,h=2+Math.random()*2.5;
    let x,z;do{x=(Math.random()-.5)*74;z=(Math.random()-.5)*74}while(Math.hypot(x,z)<7||avoid.some(g=>Math.hypot(x-g.x,z-g.z)<10));
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),crateMat);
    m.position.set(x,h/2,z);scene.add(m);boxMeshes.push(m);crateList.push(m);boxes.push({x,z,hw:w/2,hd:d/2});
  }
}
buildCrates(12);
// Perimeter
const wallMat=new THREE.MeshLambertMaterial({color:0x7a3f7e});
[[0,-45,90,1],[0,45,90,1],[-45,0,1,90],[45,0,1,90]].forEach(([x,z,w,d])=>{
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,6,d),wallMat);m.position.set(x,3,z);scene.add(m);boxMeshes.push(m);
});
const LIM=43;
function resolve(p,r){
  for(const b of boxes){
    const dx=p.x-b.x,dz=p.z-b.z,px=b.hw+r-Math.abs(dx),pz=b.hd+r-Math.abs(dz);
    if(px>0&&pz>0){if(px<pz)p.x+=(dx<0?-1:1)*px;else p.z+=(dz<0?-1:1)*pz}
  }
  p.x=Math.max(-LIM,Math.min(LIM,p.x));p.z=Math.max(-LIM,Math.min(LIM,p.z));
}

// Gun
const gun=new THREE.Group();
const gb=new THREE.Mesh(new THREE.BoxGeometry(.12,.14,.6),new THREE.MeshLambertMaterial({color:0x222233}));
const gt=new THREE.Mesh(new THREE.BoxGeometry(.05,.05,.3),new THREE.MeshLambertMaterial({color:0x46e0d0}));
gt.position.set(0,.03,-.4);gun.add(gb,gt);gun.position.set(.28,-.26,-.55);camera.add(gun);
const flash=new THREE.PointLight(0xffd23f,0,8);flash.position.set(0,0,-1);camera.add(flash);

// State
const P={x:0,z:0,yaw:0,pitch:0,hp:100};
let state='menu',score=0,wave=0,fireCd=0,flashT=0,hurtCd=0,bob=0;
let gameTime=0,lastDamageAt=0,lastSpectreHeal=0;
const enemies=[],bits=[],projectiles=[];
const eGeo=new THREE.OctahedronGeometry(.7,0);
const ENEMY_TYPES={
  flies:{
    name:'Flies',
    color:0xffd23f,
    emissive:0x664400,
    hp:2,
    speed:1,
    baseSpeed:2.4,
    damage:6,
    contactRange:1.6,
    radius:0.7,
    bob:0.25,
    score:10,
    attack:'melee'
  },
  marshalls:{
    name:'Marshalls',
    color:0x46e0d0,
    emissive:0x0d385a,
    hp:2,
    speed:1,
    baseSpeed:2.4,
    damage:6,
    contactRange:1.4,
    radius:0.75,
    bob:0.25,
    score:14,
    attack:'ranged',
    projectileDamage:24,
    projectileSpeed:14,
    projectileCooldown:1.5,
    keepDistance:8,
    shootRange:64
  },
  barons:{
    name:'Barons',
    color:0xff3d6e,
    emissive:0x520000,
    hp:2,
    speed:2,
    baseSpeed:4.8,
    damage:12,
    contactRange:1.7,
    radius:0.9,
    bob:0.35,
    score:18,
    attack:'melee'
  }
};
const raycaster=new THREE.Raycaster();raycaster.far=80;

function makeEnemy(typeId, overrides={}){
  const def=ENEMY_TYPES[typeId]||ENEMY_TYPES.flies;
  const spec={...def,...overrides};
  const material=new THREE.MeshLambertMaterial({color:spec.color,emissive:spec.emissive});
  const m=new THREE.Mesh(eGeo,material);
  m.userData={
    type:typeId,
    name:spec.name,
    hp:spec.hp,
    maxHp:spec.hp,
    speed:spec.speed,
    damage:spec.damage,
    contactRange:spec.contactRange,
    radius:spec.radius,
    ph:Math.random()*6,
    hf:0,
    score:spec.score,
    attack:spec.attack,
    projectileDamage:spec.projectileDamage ?? spec.damage*4,
    projectileSpeed:spec.projectileSpeed ?? 7,
    projectileCooldown:spec.projectileCooldown ?? 1.5,
    keepDistance:spec.keepDistance ?? 0,
    shootRange:spec.shootRange ?? 20,
    cooldown:0
  };
  return m;
}

function spawnEnemy(typeId, x, z, overrides={}){
  const enemy=makeEnemy(typeId, overrides);
  enemy.position.set(x,1.3,z);
  const baseSpeed=overrides.speed ?? ENEMY_TYPES[typeId].baseSpeed ?? 2.4;
  enemy.userData.speed = baseSpeed * LV.speed;
  scene.add(enemy);enemies.push(enemy);
  return enemy;
}

function spawnProjectile(origin, target, damage, color){
  const proj=new THREE.Mesh(new THREE.SphereGeometry(.18,10,10),new THREE.MeshBasicMaterial({color}));
  proj.position.copy(origin);
  const dir=new THREE.Vector3().subVectors(target, origin).normalize();
  const vel=dir.multiplyScalar(8);
  scene.add(proj);projectiles.push({mesh:proj,velocity:vel,damage,life:4});
}

function pickEnemyTypeForWave(){
  const roll=Math.random();
  if(wave>=4 && roll>0.7)return 'barons';
  if(wave>=2 && roll>0.55)return 'marshalls';
  return 'flies';
}

function spawnWave(){
  wave++;$('wv').textContent=wave+'/'+LV.waves;
  const n=3+wave*2;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,r=26+Math.random()*10;
    const x=Math.max(-LIM,Math.min(LIM,P.x+Math.cos(a)*r));
    const z=Math.max(-LIM,Math.min(LIM,P.z+Math.sin(a)*r));
    const type=pickEnemyTypeForWave();
    const cfg=ENEMY_TYPES[type];
    const speed=cfg.baseSpeed + Math.random()*.8;
    spawnEnemy(type, x, z, {speed, damage: cfg.damage, attack: cfg.attack});
  }
}
function burst(pos){
  for(let i=0;i<8;i++){
    const m=new THREE.Mesh(new THREE.BoxGeometry(.18,.18,.18),new THREE.MeshBasicMaterial({color:i%2?0xffd23f:0xff3d6e}));
    m.position.copy(pos);scene.add(m);
    bits.push({m,v:new THREE.Vector3((Math.random()-.5)*7,Math.random()*5,(Math.random()-.5)*7),t:.6});
  }
}
// Audio
let ac;function beep(f,d,type,vol){vol*=OPT.vol;if(vol<.002)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(f/3,ac.currentTime+d);g.gain.setValueAtTime(vol,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}
}

function hurt(o,d){
  if(o.userData.hp===undefined)return;
  o.userData.hp-=d;o.material.emissive.setHex(0xffffff);o.userData.hf=.08;
  $('cross').classList.add('hit');setTimeout(()=>$('cross').classList.remove('hit'),90);
  if(o.userData.hp<=0){
    burst(o.position);dropLoot(o.position);Store.data.stats.kills++;beep(220,.25,'sawtooth',.08);scene.remove(o);
    const i=enemies.indexOf(o);if(i>=0)enemies.splice(i,1);
    score += (o.userData.score || 10) * wave;$('sc').textContent=score;
  }
}
function shoot(){
  const w=ITEMS[EQ.weapons[wSel]];
  if(!w){fireCd=.5;toast('No weapon in slot '+(wSel+1));return}
  fireCd=w.rate*(boostT>0?.5:1);flashT=.05;flash.intensity=2;gun.position.z=-.48;beep(520,.12,'square',.06);
  raycaster.setFromCamera({x:0,y:0},camera);
  const hits=raycaster.intersectObjects(enemies.concat(boxMeshes),false);
  if(hits.length)hurt(hits[0].object,w.dmg);
}

// Input
const keys={};let firing=false;
addEventListener('keydown',onKey);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});
addEventListener('keyup',e=>{keys[e.code]=false});
renderer.domElement.addEventListener('mousedown',e=>{if(state!=='play'||isTouch)return;firing=true;if(document.pointerLockElement!==renderer.domElement)renderer.domElement.requestPointerLock()});
addEventListener('mouseup',()=>{if(!isTouch)firing=false});
addEventListener('mousemove',e=>{

// Touch
const mv={x:0,y:0};let stickId=null,lookId=null,lx=0,ly=0,sx=0,sy=0;
const stickEl=$('stick'),knob=$('knob'),fireEl=$('fire');
function sCenter(){const r=stickEl.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}
document.addEventListener('touchstart',e=>{
  if(state!=='play')return;
  for(const t of e.changedTouches){
    if(e.target.id==='pb'||e.target.closest('#quick'))continue;
    if(fireEl.contains(e.target)){firing=true;fireEl._id=t.identifier;continue}
    if(stickEl.contains(e.target)&&stickId===null){stickId=t.identifier;[sx,sy]=sCenter();continue}
    if(t.clientX>innerWidth*.35&&lookId===null){lookId=t.identifier;lx=t.clientX;ly=t.clientY}
  }
},{passive:false});
document.addEventListener('touchmove',e=>{
  if(state==='play')e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===stickId){
      let dx=t.clientX-sx,dy=t.clientY-sy;const l=Math.hypot(dx,dy),m=50;
      if(l>m){dx*=m/l;dy*=m/l}
      mv.x=dx/m;mv.y=dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`;
    }else if(t.identifier===lookId){
      P.yaw-=(t.clientX-lx)*.005*OPT.sens;P.pitch=Math.max(-1.4,Math.min(1.4,P.pitch-(t.clientY-ly)*.005*OPT.sens*(OPT.invert?-1:1)));lx=t.clientX;ly=t.clientY;
    }
  }
},{passive:false});
function tEnd(e){
  for(const t of e.changedTouches){
    if(t.identifier===stickId){stickId=null;mv.x=mv.y=0;knob.style.transform=''}
    if(t.identifier===lookId)lookId=null;
    if(t.identifier===fireEl._id){firing=false;fireEl._id=null}
  }
}

function hudHp(){$('hpf').style.width=Math.max(0,P.hp/maxHp()*100)+'%'}

function count(id){return INV.slots.reduce((a,s)=>a+(s.id===id?s.n:0),0)}
function addItem(id,n){
  for(const s of INV.slots)if(s.id===id&&n>0){const t=Math.min(n,maxOf(id)-s.n);s.n+=t;n-=t}
  while(n>0&&INV.slots.length<INV.cap){const t=Math.min(n,maxOf(id));INV.slots.push({id,n:t});n-=t}
  return n;
}
function removeItem(id){const i=INV.slots.findIndex(s=>s.id===id);if(i<0)return;if(--INV.slots[i].n<=0)INV.slots.splice(i,1)}

function collect(k,q){

  const overflow=addItem(k.id,k.n||1);
  if(!overflow){if(!q)toast('+ '+ITEMS[k.id].name);return true}
  if(q){addScrap(overflow*(ITEMS[k.id].scrap??DEFAULT_SCRAP_VALUE));return true}
  return false;
}

// End-of-area pickup: collect everything left on the ground; warn before anything would be lost
const warnEl=$('warn');
function autoCollect(){
  let got=0,salvaged=0;const left=[];
  for(const k of pickups.splice(0)){
    const scrapBefore=WAL.scrap;
    if(collect(k,true)){scene.remove(k.m);got++;if(k.id!=='scrap')salvaged+=WAL.scrap-scrapBefore}
    else left.push(k);
  }
  pickups.push(...left);save();refreshQuick();return{got,left,salvaged};
}
function leavePickups(){

function companionTick(dt){

  compM.position.set(P.x+Math.cos(compT*1.2)*1.6,2.1+Math.sin(compT*2)*.25,P.z+Math.sin(compT*1.2)*1.6);

    if(P.hp<maxHp() && sinceDamage>=safeFor && gameTime-lastSpectreHeal>=interval){

// Key rebinding
const ACTIONS=[['forward','Move forward'],['back','Move back'],['left','Strafe left'],['right','Strafe right'],['sprint','Sprint'],['pause','Pause'],['inventory','Inventory'],['map','Open map'],['use','Use'],['item1','Item 1'],['item2','Item 2'],['w1','Weapon 1'],['w2','Weapon 2'],['w3','Weapon 3'],['compendium','Compendium']];
let rebind=null,mapOpen=false;
function onKey(e){
  if(rebind){
    e.preventDefault();const r=rebind;rebind=null;
    if(e.code!=='Escape'){const old=B[r.a],hit=Object.keys(B).find(k=>B[k]===e.code&&k!==r.a);if(hit)B[hit]=old;B[r.a]=e.code;save()}
    controls(r.back);return;
  }
  if(compOpen()&&(e.code===B.compendium||e.code==='Escape')){e.preventDefault();closeComp();return}
  if(invOpen()&&(e.code===B.inventory||e.code==='Escape')){e.preventDefault();closeInv();return}
  keys[e.code]=true;
  if(state==='paused'&&mapOpen&&e.code===B.map){resume();return}
  if(state!=='play')return;
  if(e.code==='Escape'||e.code===B.pause)pause();
  else if(e.code===B.inventory)inventory(resume);
  else if(e.code===B.compendium)compendium(resume);
  else if(e.code===B.use){toast('Use: interact with nearby world objects');}
  else if(/^w[123]$/.test(wk(e.code))){wSel=+wk(e.code)[1]-1;toast('Weapon '+(wSel+1)+': '+(ITEMS[EQ.weapons[wSel]]?ITEMS[EQ.weapons[wSel]].name:'empty'))}
  else if(e.code===B.map){state='paused';release();worldMap(null,null,resume)}
  else if(e.code===B.item1)useBoundItem('item1');
  else if(e.code===B.item2)useBoundItem('item2');
}
function controls(back){
  screen('Controls','Pick an action, then press the new key. Esc cancels. Mouse click always fires.');
  ACTIONS.forEach(([a,label])=>btn(label+': '+keyName(B[a]),()=>{
    rebind={a,back};screen('Press a key','Rebinding "'+label+'". Esc cancels.');
    btn('Cancel',()=>{rebind=null;controls(back)});
  }));
  btn('Reset to defaults',()=>{Object.assign(B,Store.defaults().keys);save();controls(back)});
  btn('Back',()=>options(back));
}

const invEl=$('inv');let invSel=null,invBack=null;

const setRef=(r,id)=>{if(r[0]==='w')EQ.weapons[r[1]]=id;else if(r[0]==='a')EQ.armor[r[1]]=id;else if(r[0]==='i')EQ.itemSlots[r[1]]=id;else EQ.companion=id};
function info(id){
  const t=ITEMS[id],p=[];
  if(t.dmg)p.push('Damage '+t.dmg);if(t.rate)p.push((1/t.rate).toFixed(1)+' shots/s');if(t.armor)p.push('Armor +'+t.armor);
  if(t.hp)p.push('Max health +'+t.hp);if(t.speed)p.push('Speed +'+Math.round(t.speed*100)+'%');if(t.cdmg)p.push('Assist '+t.cdmg+' dmg every '+t.iv+'s');
  if(t.heal)p.push('Heals '+Math.round(t.heal*100)+'% max HP every '+t.interval+'s after '+t.wait+'s of no damage');

function cell(a,k,label,id,extra,sel){return `<button class="cell ${id?'':'empty'} ${sel?'sel':''}" data-a="${a}" data-k="${k}"><small>${label}</small>${id?ITEMS[id].name:'Empty'}${extra||''}</button>`}

    if(state!=='play')resume();
    const rewards=[];
    if(r.got)rewards.push(r.got+' pickup'+(r.got>1?'s':'')+' collected');
    if(r.salvaged)rewards.push(r.salvaged+' scrap salvaged');
    toast(rewards.length?'Area clear. '+rewards.join('; ')+'.':'Area clear. Follow a gate to travel on.');
  };
  if(r.left.length)warnFull(finish);else finish();
}
function over(){
  state='over';release();screen('Overrun at '+LV.name,'Score '+score+'. The flats go quiet.');
  btn('Retry area',()=>enterArea(LV,null,true),'main');btn('Open map',()=>worldMap(null,null,over));btn('Return home',mainMenu);
}
$('pb').addEventListener('click',()=>{if(state==='play')pause()});

// Loop
const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05);
  if(state==='play'){
    // movement
    let f=(keys[B.forward]||keys.ArrowUp?1:0)-(keys[B.back]||keys.ArrowDown?1:0)-mv.y;
    let s=(keys[B.right]||keys.ArrowRight?1:0)-(keys[B.left]||keys.ArrowLeft?1:0)+mv.x;
    const l=Math.hypot(f,s);if(l>1){f/=l;s/=l}
    const sp=(keys[B.sprint]?9:6)*(1+bonus('speed'))*dt,sy=Math.sin(P.yaw),cy=Math.cos(P.yaw);
    P.x+=(-sy*f+cy*s)*sp;P.z+=(-cy*f-sy*s)*sp;resolve(P,.5);
    if(l>0)bob+=dt*10;
    camera.position.set(P.x,1.7+Math.sin(bob)*.04*(l>0),P.z);
    camera.rotation.set(P.pitch,P.yaw,0);
    // weapon
    fireCd-=dt;boostT=Math.max(0,boostT-dt);if(firing&&fireCd<=0&&!inHome)shoot();
    gun.position.z+=(-.55-gun.position.z)*Math.min(1,dt*18);
    if(flashT>0){flashT-=dt;if(flashT<=0)flash.intensity=0}
    // enemies
    companionTick(dt);hurtCd-=dt;
    for(const e of enemies){
      const dx=P.x-e.position.x,dz=P.z-e.position.z,d=Math.hypot(dx,dz)||1;
      const type=ENEMY_TYPES[e.userData.type]||ENEMY_TYPES.flies;
      const dirX=dx/d,dirZ=dz/d;
      e.userData.cooldown=Math.max(0,e.userData.cooldown-dt);
      e.userData.ph+=dt*3;e.position.y=1.3+Math.sin(e.userData.ph)*.25;e.rotation.y+=dt*2;
      if(e.userData.hf>0){e.userData.hf-=dt;if(e.userData.hf<=0)e.material.emissive.setHex(type.emissive)}

      if(e.userData.type==='marshalls'){
        if(d<type.keepDistance){
          e.position.x-=dirX*e.userData.speed*dt;
          e.position.z-=dirZ*e.userData.speed*dt;
        }
        if(d<=type.shootRange && e.userData.cooldown<=0){
          e.userData.cooldown=type.projectileCooldown;
          const damage=type.projectileDamage || type.damage*4;
          const projectileSpeed = type.projectileSpeed || 8;
          const pOrigin=e.position.clone().add(new THREE.Vector3(0,0.2,0));
          const pTarget=new THREE.Vector3(P.x,1.7,P.z);
          const dir=new THREE.Vector3().subVectors(pTarget,pOrigin).normalize();
          const velocity=dir.multiplyScalar(projectileSpeed);
          const proj=new THREE.Mesh(new THREE.SphereGeometry(.18,10,10),new THREE.MeshBasicMaterial({color:type.color}));
          proj.position.copy(pOrigin);scene.add(proj);projectiles.push({mesh:proj,velocity,damage,life:4});
          beep(430,.12,'square',.04);
        }
      }else{
        if(d>type.contactRange){e.position.x+=dirX*e.userData.speed*dt;e.position.z+=dirZ*e.userData.speed*dt}
      }

      resolve(e.position,.6);
      if(d<e.userData.contactRange&&hurtCd<=0){
        hurtCd=.7;P.hp-=e.userData.damage*(1-armorRed());lastDamageAt=gameTime;hudHp();
        $('vig').style.opacity=.9;setTimeout(()=>$('vig').style.opacity=0,200);beep(110,.2,'sawtooth',.1);
        if(P.hp<=0){over()}
      }
    }
    for(let i=projectiles.length-1;i>=0;i--){
      const p=projectiles[i];
      p.mesh.position.addScaledVector(p.velocity,dt);
      p.life-=dt;
      if(Math.hypot(p.mesh.position.x-P.x,p.mesh.position.z-P.z)<.9){
        P.hp-=p.damage*(1-armorRed());lastDamageAt=gameTime;hudHp();
        $('vig').style.opacity=.9;setTimeout(()=>$('vig').style.opacity=0,200);beep(110,.2,'sawtooth',.1);
        scene.remove(p.mesh);projectiles.splice(i,1);
        if(P.hp<=0){over();break}
        continue;
      }
      if(p.life<=0){scene.remove(p.mesh);projectiles.splice(i,1)}
    }
    for(let i=pickups.length-1;i>=0;i--){
      const k=pickups[i];k.t-=dt;k.m.rotation.y+=dt*2;k.m.position.y=.6+Math.sin(k.t*3)*.12;
      if(Math.hypot(P.x-k.m.position.x,P.z-k.m.position.z)<1.5){
        if(collect(k)){scene.remove(k.m);pickups.splice(i,1);beep(880,.1,'sine',.06);save();refreshQuick();continue}
        else if(!k.warned){k.warned=1;toast('Inventory full')}
      }
    }
    if(inHome){
      let on=null;for(const d of HOME_PADS)if(Math.hypot(P.x-d.x,P.z-d.z)<2.2)on=d;
      if(!on)padHot=null;else if(on!==padHot){padHot=on;state='paused';release();on.act()}
    }
    for(const g of gates)if(Math.hypot(P.x-g.x,P.z-g.z)<2.8){enterArea(g.node,LV);break}
    $('dr').textContent=enemies.length;
    if(state==='play'&&!areaClear&&!enemies.length){if(wave>=LV.waves)complete();else spawnWave()}
  }
  gameTime += dt;
  for(let i=bits.length-1;i>=0;i--){
    const b=bits[i];b.t-=dt;b.v.y-=14*dt;b.m.position.addScaledVector(b.v,dt);
    if(b.t<=0){scene.remove(b.m);bits.splice(i,1)}
  }
  renderer.render(scene,camera);
}
camera.position.set(0,1.7,0);
tick();
// Always start at home, in play, with no menu in the way
enterHome();state='play';ov.style.display='none';
$('pb').classList.add('on');$('quick').classList.add('on');refreshQuick();
document.addEventListener('pointerdown',unlockAudio);
toast(isTouch?'Stick to move, drag to look, II for the menu':'Click to look around. Esc opens the menu.',5000);
})();
</script>
